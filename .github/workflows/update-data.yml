name: Update news and clouds

on:
  schedule:
    - cron: "17 * * * *" # 매시간 17분 (UTC 기준, 실제 실행은 몇 분 늦을 수 있음)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest news and cloud map
        run: node scripts/update-data.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update news and clouds $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
