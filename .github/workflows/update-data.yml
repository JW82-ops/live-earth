name: Update news and clouds

# 기사·구름 데이터는 저장소에 커밋하지 않고, 매번 받아서 사이트와 함께 GitHub Pages로 바로 배포한다.
# (Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 함)
on:
  schedule:
    - cron: "17 * * * *" # 매시간 17분 (UTC 기준, 실제 실행은 몇 분 늦을 수 있음)
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest news and cloud map
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/update-data.mjs

      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp -r index.html countries.js world.js snapshot.js earth-*.jpg earth-*.png .nojekyll data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
