name: Update news and clouds

# 기사·구름 데이터는 저장소에 커밋하지 않고, 매번 받아서 사이트와 함께 GitHub Pages로 바로 배포한다.
# (Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 함)
on:
  schedule:
    - cron: "17 * * * *" # 매시간 17분 (UTC 기준, 실제 실행은 몇 분 늦을 수 있음)
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download world city list (GeoNames, about once a week)
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "$(date -u +%u%H)" = "103" ] || ! curl -fsI "${SITE_URL}data/cities.json" >/dev/null 2>&1; then
            curl -fsSL --retry 2 -o /tmp/cities.zip https://download.geonames.org/export/dump/cities15000.zip && unzip -o -q /tmp/cities.zip -d /tmp && echo "downloaded" || echo "geonames unavailable"
          else
            echo "skip (weekly)"
          fi

      - name: Fetch latest news and cloud map
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
          MOFA_KEY: ${{ secrets.MOFA_KEY }}
        run: node scripts/update-data.mjs

      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp -r index.html *.js *.jpg *.png manifest.webmanifest .nojekyll data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub 쪽이 잠깐 불안정해 "artifact를 못 찾음"으로 실패하는 경우가 있어, 잠시 기다렸다 한 번 더 시도한다.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying deploy
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60

      - id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
