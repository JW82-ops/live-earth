<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>라이브 어스</title>
<meta name="description" content="실시간으로 낮과 밤이 바뀌는 3D 지구. 나라별 환율·날씨·뉴스, 지진, 국제우주정거장 위치까지.">
<meta name="theme-color" content="#03060b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="라이브 어스">
<meta property="og:type" content="website">
<meta property="og:site_name" content="라이브 어스">
<meta property="og:title" content="라이브 어스 · 실시간 3D 지구">
<meta property="og:description" content="지금 이 순간의 낮과 밤, 나라별 환율·날씨·뉴스, 지진과 우주정거장까지 손가락으로 돌려보세요.">
<meta property="og:url" content="https://jw82-ops.github.io/live-earth/">
<meta property="og:image" content="https://jw82-ops.github.io/live-earth/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 한 화면짜리 우주 뷰: 캔버스가 전부를 채우고, 정보는 유리판 한 장(데스크톱 오른쪽, 휴대폰 아래)에만 올린다 */
  color-scheme:dark;
  --space:#03060b;
  --panel:rgba(9,14,23,.86);
  --ink:#e9eef5;
  --muted:#8d9aae;
  --line:rgba(255,255,255,.1);
  --sun:#ffb454;
  --live:#5ee08a;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
.hud{position:fixed;top:0;left:0;padding:16px;display:flex;flex-direction:column;gap:4px;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.hud h1{font-size:17px;font-weight:600;letter-spacing:.02em}
.hud .clock{font-family:var(--font-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-direction:column;gap:8px;margin-top:8px;width:min(270px,calc(100vw - 32px));pointer-events:auto;text-shadow:none}
.search{position:relative}
#q{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(9,14,23,.72);color:var(--ink);font:inherit;font-size:14px;padding:0 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#q::placeholder{color:var(--muted)}
#q:focus-visible,.tools button:focus-visible,#when:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
#q-list{position:absolute;top:42px;left:0;right:0;background:rgba(9,14,23,.96);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none;flex-direction:column;z-index:5}
#q-list.on{display:flex}
#q-list button{appearance:none;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;text-align:left;padding:9px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
#q-list button:last-child{border-bottom:0}
#q-list button:hover{background:rgba(255,255,255,.07)}
#q-list small{color:var(--muted);font-size:12px}
.timebar{display:flex;align-items:center;gap:8px;background:rgba(9,14,23,.72);border:1px solid var(--line);border-radius:10px;padding:6px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.timebar label{font-size:12px;color:var(--muted);white-space:nowrap}
#when{flex:1;min-width:0;accent-color:var(--sun)}
.tools .mini{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-size:12px;border-radius:8px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.tools .mini[aria-pressed="false"]{color:var(--muted)}
.tools .mini:disabled{opacity:.4;cursor:default}
.hint{position:fixed;left:16px;bottom:16px;font-size:12px;color:var(--muted);pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.9)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);pointer-events:none;transition:opacity .6s}
#loading.done{opacity:0}

#panel{position:fixed;top:16px;right:16px;bottom:16px;width:360px;background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
.p-head{display:flex;gap:12px;align-items:flex-start;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.flag{font-size:34px;line-height:1}
.p-title{flex:1;min-width:0}
.p-title h2{font-size:22px;font-weight:600;line-height:1.2;text-wrap:balance}
.p-title p{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
#close{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;flex:none}
#close:focus-visible,a:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.p-body{overflow-y:auto;padding:4px 18px 18px;display:flex;flex-direction:column}
section{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
section:last-child{border-bottom:0}
.s-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.s-head h3{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.06em}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sun)}
.chip.live{color:var(--live);border-color:rgba(94,224,138,.35)}
.chip.live::before{background:var(--live)}
.big.txt{font-family:var(--font-body);font-weight:600}
.big{font-family:var(--font-num);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15}
.sub{font-size:13px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.row b{font-family:var(--font-num);font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.row span{color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--ink);text-decoration:none;font-size:13px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.links a::after{content:" ↗";color:var(--sun)}
.links a:hover{background:rgba(255,255,255,.09)}
.note{font-size:12px;color:var(--muted)}
.news{display:flex;flex-direction:column}
.news>a{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.news>a:last-child{border-bottom:0}
.news>a:hover strong{text-decoration:underline;text-decoration-color:var(--sun);text-underline-offset:3px}
.news strong{font-size:14px;font-weight:500;line-height:1.45}
.news small{font-size:12px;color:var(--muted)}
.more{margin-top:6px}
.sky{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.sky i{width:10px;height:10px;border-radius:50%;background:var(--sun);box-shadow:0 0 10px var(--sun)}
.sky.night i{background:#6f86c9;box-shadow:0 0 10px #6f86c9}
.sky.dusk i{background:#e0785a;box-shadow:0 0 10px #e0785a}

[hidden]{display:none!important}
#cty,#alt{display:flex;flex-direction:column}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.layers .mini{background:rgba(9,14,23,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px 10px;display:inline-flex;align-items:center;gap:6px}
.layers .mini i{width:7px;height:7px;border-radius:50%;background:currentColor}
#cloud i{background:#cfe0ff}#quake-btn i{background:#ff7a45}#iss-btn i{background:#7df9ff}
.layers .mini[aria-pressed="false"]:not(#tour-btn) i{background:transparent;box-shadow:inset 0 0 0 1px currentColor}
.qdot{display:inline-block;width:30px;height:30px;border-radius:50%;margin:2px}
.qdot.iss{background:radial-gradient(circle,#fff 0 18%,#7df9ff 30%,rgba(125,249,255,0) 70%)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%}
.hud{padding-top:max(16px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left))}
#panel{bottom:max(16px,env(safe-area-inset-bottom))}
#storm-btn i{background:#ff8cc0}#aurora-btn i{background:#5dff9c}
#tour-btn{border-color:rgba(255,180,84,.6);color:var(--sun)}
#tour-btn i{width:0;height:0;border-radius:0;background:none!important;box-shadow:none!important;border-left:8px solid var(--sun);border-top:5px solid transparent;border-bottom:5px solid transparent}
.qdot.storm{background:radial-gradient(circle,#fff 0 14%,#ff8cc0 34%,rgba(255,95,162,0) 70%)}
.qdot.aur{background:radial-gradient(circle,#e6fff0 0 14%,#5dff9c 38%,rgba(93,255,156,0) 72%)}
.p-head .mini{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-size:13px;border-radius:99px;padding:0 12px;height:34px;cursor:pointer;flex:none}
.p-head .mini:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 10px;font-size:14px;align-items:baseline}
.cmp .h{font-size:12px;color:var(--muted);text-align:right;overflow-wrap:anywhere}
.cmp span{color:var(--muted)}
.cmp b{font-family:var(--font-num);font-weight:500;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.cmp b.t{font-family:var(--font-body)}
.spark{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.spark .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.spark .chg{font-family:var(--font-num);font-size:13px;color:var(--ink)}
.spark svg{width:100%;height:auto;display:block}
.spark .meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);background:rgba(9,14,23,.94);border:1px solid var(--sun);border-radius:12px;padding:8px 8px 8px 14px;font-size:13px;display:flex;gap:10px;align-items:center;z-index:20;max-width:calc(100vw - 32px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:12px;border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.hud,.hint,#panel{transition:opacity .6s}
body.touring .hud,body.touring .hint,body.touring #panel,body.touring #toast{opacity:0;pointer-events:none}
body.touring #stage{cursor:none}
#caption{position:fixed;left:max(28px,env(safe-area-inset-left));bottom:max(44px,env(safe-area-inset-bottom));display:none;flex-direction:column;gap:6px;pointer-events:none;text-shadow:0 2px 24px rgba(0,0,0,.95),0 1px 3px rgba(0,0,0,.8);max-width:min(620px,calc(100vw - 56px))}
body.touring #caption{display:flex}
#caption .in{opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform .9s ease}
#caption.show .in{opacity:1;transform:none}
#caption .live{font-family:var(--font-num);font-size:12px;letter-spacing:.12em;color:var(--live);transition-delay:0s}
#caption .t{font-size:clamp(30px,6.4vw,58px);font-weight:600;line-height:1.08;letter-spacing:-.01em;text-wrap:balance;transition-delay:.12s}
#caption .s{font-size:clamp(14px,2.5vw,20px);color:#dbe3ee;transition-delay:.28s}
#tourhint{position:fixed;right:16px;top:max(16px,env(safe-area-inset-top));font-size:12px;color:var(--muted);display:none;pointer-events:none}
body.touring #tourhint{display:block;animation:fadeaway 5s forwards}
@keyframes fadeaway{0%,70%{opacity:1}100%{opacity:0}}
@media (max-width:720px){
  #panel{top:auto;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));width:auto;height:54%;transform:translateY(calc(100% + 16px))}
  .hint{display:none}
  body.panel-open .timebar,body.panel-open .layers{display:none}
  .p-title h2{font-size:20px}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>
</head>
<body>
<div id="stage" aria-label="3D 지구. 드래그로 회전, 핀치나 휠로 확대, 나라를 눌러 정보 보기"></div>
<div id="loading">지구를 불러오는 중…</div>

<div class="hud">
  <h1>라이브 어스</h1>
  <div class="clock" id="clock">UTC --:--:--</div>
  <div class="tools">
    <div class="search">
      <input id="q" type="search" placeholder="나라 검색 (예: 프랑스, Japan)" autocomplete="off" aria-label="나라 검색">
      <div id="q-list" role="listbox"></div>
    </div>
    <div class="timebar">
      <label for="when" id="when-label">시간 이동</label>
      <input id="when" type="range" min="-720" max="720" step="10" value="0" aria-label="낮과 밤을 앞뒤 12시간까지 이동">
      <button class="mini" id="now" type="button" disabled>지금</button>
    </div>
    <div class="layers" role="group" aria-label="지구 위에 표시할 것">
      <button class="mini" id="cloud" type="button" aria-pressed="true" title="연출용 구름 (실제 구름 아님)"><i></i><span>구름</span></button>
      <button class="mini" id="quake-btn" type="button" aria-pressed="true" title="최근 24시간 규모 2.5 이상 지진"><i></i><span>지진</span></button>
      <button class="mini" id="iss-btn" type="button" aria-pressed="true" title="국제우주정거장 실시간 위치"><i></i><span>ISS</span></button>
      <button class="mini" id="storm-btn" type="button" aria-pressed="true" title="지금 활동 중인 태풍·허리케인·사이클론"><i></i><span>태풍</span></button>
      <button class="mini" id="aurora-btn" type="button" aria-pressed="true" title="NOAA 오로라 예보"><i></i><span>오로라</span></button>
      <button class="mini" id="tour-btn" type="button" title="지구를 자동으로 둘러보는 시네마틱 투어"><i></i><span>투어</span></button>
    </div>
  </div>
</div>
<div id="toast" hidden><span id="toast-t"></span><button id="toast-x" type="button">취소</button></div>
<div id="caption" aria-live="polite"><div class="in live" id="cap-l">LIVE</div><div class="in t" id="cap-t"></div><div class="in s" id="cap-s"></div></div>
<div id="tourhint">화면을 누르면 투어가 끝나요</div>
<div class="hint">드래그로 회전 · 핀치/휠로 확대 · 나라·지진·ISS·태풍·오로라를 누르면 정보 · 투어로 자동 감상</div>

<aside id="panel" aria-live="polite">
  <div class="p-head">
    <div class="flag" id="p-flag"></div>
    <div class="p-title"><h2 id="p-name"></h2><p id="p-sub"></p></div>
    <button id="cmp" class="mini" type="button" title="다른 나라와 비교">비교</button>
    <button id="close" type="button" aria-label="패널 닫기">×</button>
  </div>
  <div class="p-body">
   <div id="alt" hidden></div>
   <div id="cty">
    <section>
      <div class="s-head"><h3>현지 시각</h3><span class="chip live">실시간</span></div>
      <div class="big" id="p-time">--:--:--</div>
      <div class="sub" id="p-date"></div>
      <div class="sky" id="p-sky"><i></i><span></span></div>
    </section>
    <section>
      <div class="s-head"><h3>기본 정보</h3></div>
      <div class="rows" id="p-info"></div>
    </section>
    <section>
      <div class="s-head"><h3>환율</h3><span class="chip" id="fx-chip"></span></div>
      <div class="rows" id="p-fx"></div>
    </section>
    <section>
      <div class="s-head"><h3>날씨</h3><span class="chip" id="wx-chip"></span></div>
      <div id="p-wx"></div>
    </section>
    <section>
      <div class="s-head"><h3>최신 뉴스</h3><span class="chip" id="news-chip"></span></div>
      <div class="links" id="p-news"></div>
    </section>
    <section>
      <div class="s-head"><h3>음악</h3><span class="chip">YouTube에서 열기</span></div>
      <div class="links" id="p-music"></div>
    </section>
   </div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
<script src="countries.js"></script>
<script src="world.js"></script>
<script src="snapshot.js"></script>
<script>
(function(){
"use strict";
var D2R=Math.PI/180, R2D=180/Math.PI;
var $=function(id){return document.getElementById(id)};
var stage=$("stage"), panel=$("panel");
var reduceMotion=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- 좌표 ---------- */
function ll2v(lat,lon,r){var a=lat*D2R,b=lon*D2R,c=Math.cos(a);return new THREE.Vector3(r*c*Math.cos(b),r*Math.sin(a),-r*c*Math.sin(b))}
function sunLL(ms){ // 지금 태양이 머리 위에 있는 지점
  var d=ms/86400000-10957.5;
  var g=(357.529+0.98560028*d)*D2R, q=280.459+0.98564736*d;
  var L=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*D2R, e=(23.439-0.00000036*d)*D2R;
  var ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))*R2D, dec=Math.asin(Math.sin(e)*Math.sin(L))*R2D;
  var gmst=(18.697374558+24.06570982441908*d)*15;
  var lon=((ra-gmst)%360+540)%360-180;
  return {lat:dec,lon:lon};
}

/* ---------- 장면 ---------- */
var renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:"high-performance"})}
catch(err){$("loading").textContent="이 기기에서는 3D(WebGL)를 켤 수 없어요.";return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x03060b,1);
stage.appendChild(renderer.domElement);
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(38,1,0.05,400);
var sunDir=new THREE.Vector3(1,0,0);

var loader=new THREE.TextureLoader(), pending=4;
function tex(src){

  var b1=el("a",null,A.ko+"와(과) 다른 나라 비교");b1.href="#";b1.addEventListener("click",function(e){e.preventDefault();cmpBase=A;toast(A.ko+"와(과) 비교할 나라를 누르거나 검색하세요")});l.appendChild(b1);s6.appendChild(l);
  var va=ll2v(A.lat,A.lng,1),vb=ll2v(B.lat,B.lng,1),m=va.add(vb).normalize();
  fly(Math.atan2(-m.z,m.x)*R2D,Math.asin(m.y)*R2D);
  if(km>7000)cam.dist=Math.max(cam.dist,fitDist*1.1);
}
function dayNight(lat,lon){if(lat==null)return "-";var rs=sunLL(Date.now()),alt_=Math.asin(Math.max(-1,Math.min(1,ll2v(lat,lon,1).dot(ll2v(rs.lat,rs.lon,1)))))*R2D;return alt_>0?"낮":alt_>-6?"해질녘·새벽":"밤"}
function tickCmp(){if(!alt||alt.type!=="cmp")return;var ta=$("cmp-ta"),tb=$("cmp-tb");if(ta)ta.textContent=hm24(alt.A.tz);if(tb)tb.textContent=hm24(alt.B.tz)}

/* ---------- 환율 30일 그래프 ---------- */
var FXH=null;
getJSON("data/fxhist.json?v="+Math.floor(Date.now()/3600000)).then(function(j){FXH=j;if(current&&current.c)renderFx(current.c)}).catch(function(){});
function spark(code){
  var vals=FXH.rates[code],dates=FXH.dates,pts=[];
  for(var i=0;i<vals.length;i++)if(vals[i]!=null)pts.push([i,vals[i]]);
  var box=el("div","spark");if(pts.length<2)return box;
  var last=pts[pts.length-1][1],u=last<0.02?1000:(last<2||code==="JPY"?100:1);
  var lo=Infinity,hi=-Infinity;pts.forEach(function(p){lo=Math.min(lo,p[1]);hi=Math.max(hi,p[1])});
  var W=300,H=78,pad=4,span=(hi-lo)||hi*0.01,X=function(i){return pad+(W-2*pad)*i/(vals.length-1)},Y=function(v){return pad+(H-2*pad)*(1-(v-lo)/span)};
  var d=pts.map(function(p,k){return (k?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)}).join(" ");
  var area=d+" L"+X(pts[pts.length-1][0]).toFixed(1)+" "+H+" L"+X(pts[0][0]).toFixed(1)+" "+H+" Z";
  var chg=(last/pts[0][1]-1)*100;
  var top=el("div","top");top.appendChild(el("span",null,"원화 기준 "+nf(u,0)+" "+code+" · 최근 "+vals.length+"영업일"));
  top.appendChild(el("span","chg",(chg>=0?"+":"")+chg.toFixed(2)+"%"));box.appendChild(top);
  var NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("role","img");
  svg.setAttribute("aria-label",code+" 원화 환율 30일 추이, "+(chg>=0?"상승 ":"하락 ")+Math.abs(chg).toFixed(2)+"%");
  var gid="sg"+code;
  svg.innerHTML='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb454" stop-opacity=".32"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></linearGradient></defs>'+
    '<line x1="0" x2="'+W+'" y1="'+Y(hi).toFixed(1)+'" y2="'+Y(hi).toFixed(1)+'" stroke="rgba(255,255,255,.08)"/><line x1="0" x2="'+W+'" y1="'+Y(lo).toFixed(1)+'" y2="'+Y(lo).toFixed(1)+'" stroke="rgba(255,255,255,.08)"/>'+
    '<path d="'+area+'" fill="url(#'+gid+')"/><path d="'+d+'" fill="none" stroke="#ffb454" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+X(pts[pts.length-1][0]).toFixed(1)+'" cy="'+Y(last).toFixed(1)+'" r="3.4" fill="#ffb454" stroke="#03060b" stroke-width="1.5"/>';
  box.appendChild(svg);
  var meta=el("div","meta"),md=function(s){var p=s.split("-");return (+p[1])+"/"+(+p[2])};
  meta.appendChild(el("span",null,md(dates[pts[0][0]])));meta.appendChild(el("span",null,"최저 "+nf(lo*u,lo*u<10?2:1)+" · 최고 "+nf(hi*u,hi*u<10?2:1)+"원"));meta.appendChild(el("span",null,md(dates[pts[pts.length-1][0]])));
  box.appendChild(meta);box.appendChild(el("div","note","유럽중앙은행 기준환율 (영업일 1회) · 위 실시간 환율과 조금 다를 수 있어요."));
  return box;
}

/* ---------- 시네마틱 투어 ---------- */
var tour=null;
function landAlong(lon){
  var lats=[35,25,45,15,52,5,-5,-15,-25,-35,58];
  for(var d=0;d<=15;d+=3)for(var sg=-1;sg<=1;sg+=2){var L=((lon+sg*d+540)%360)-180;for(var i=0;i<lats.length;i++){var f=findCountry(lats[i],L);if(f)return {lat:lats[i],lon:L,f:f}}if(d===0)break}
  return {lat:15,lon:lon,f:null};
}
function placeLine(p){var c=p.f&&COUNTRIES[p.f.id];return c?c.ko+(c.tz?" · 현지 "+hm24(c.tz):""):""}
function buildStops(){
  var st=[],s0=sunLL(Date.now()),wide=Math.max(fitDist*1.12,3.1);
  st.push({lon:cam.lon,lat:18,dist:wide,hold:4.5,title:"라이브 어스",sub:"지금 이 순간, 살아 있는 지구"});
  var rise=landAlong(((s0.lon-88+540)%360)-180);
  st.push({lon:rise.lon,lat:rise.lat,dist:2.0,hold:5,title:"지금 해가 뜨는 곳",sub:placeLine(rise)||"새벽이 밝아오는 바다 위"});
  st.push({lon:126.98,lat:37.57,dist:1.7,hold:5,title:"서울",sub:"현지 "+hm24("Asia/Seoul")+" · 지금 "+dayNight(37.57,126.98)+(rates&&rates.KRW?" · 1달러 "+nf(rates.KRW,0)+"원":"")});
  var q24=QUAKES.filter(function(q){return Date.now()-q.time<24*3600e3}).sort(function(a,b){return b.mag-a.mag})[0];
  if(q24&&quakePts.visible)st.push({lon:q24.lon,lat:q24.lat,dist:1.85,hold:5,title:"규모 "+q24.mag.toFixed(1)+" 지진",sub:(landName(q24.lat,q24.lon)||"바다")+" · "+ago(new Date(q24.time).toISOString())});
  if(stormGroup.visible)STORMS.slice().sort(function(a,b){return b.wind-a.wind}).slice(0,2).forEach(function(sm){st.push({lon:sm.pos[0],lat:sm.pos[1],dist:1.85,hold:5,title:stormKind(sm)+" "+sm.name,sub:"최대 풍속 "+sm.wind+" km/h · 강도 "+stormGrade(sm.wind)})});
  if(AUR&&aurora.visible){var b=aurBest();if(b)st.push({lon:b.lon,lat:b.lat>0?Math.min(64,b.lat-6):Math.max(-64,b.lat+6),dist:2.15,hold:6,title:"오로라",sub:(b.lat>0?"북":"남")+"극권 밤하늘"+(AUR.kp!=null?" · Kp "+(+AUR.kp).toFixed(1):"")})}
  if(issPos&&issGroup.visible)st.push({follow:"iss",dist:1.65,hold:9,title:"국제우주정거장",sub:"",dyn:function(){var ln=issPos&&landName(issPos.lat,issPos.lon);return (ln?ln+" 상공":"바다 위")+" · 시속 "+nf(issPos.vel,0)+" km"}});
  var set=landAlong(((s0.lon+88+540)%360)-180);
  st.push({lon:set.lon,lat:set.lat,dist:2.0,hold:5,title:"지금 해가 지는 곳",sub:placeLine(set)||"노을이 지는 바다 위"});
  st.push({lon:set.lon+50,lat:12,dist:wide,hold:5.5,title:"라이브 어스",sub:"jw82-ops.github.io/live-earth"});
  return st;
}
function showCaption(S){$("cap-t").textContent=S.title;$("cap-s").textContent=S.dyn?S.dyn():S.sub;$("caption").classList.add("show")}
function hideCaption(){$("caption").classList.remove("show")}
function startTour(){
  if(panel.classList.contains("open"))$("close").click();
  cmpBase=null;$("toast").hidden=true;setShift(0);target=null;q.blur();qList.classList.remove("on");
  document.body.classList.add("touring");$("cap-l").textContent="LIVE · UTC "+new Date().toISOString().slice(11,16);
  tour={stops:buildStops(),i:0,phase:"fly",t:0,dur:0,cap:0,from:{lon:cam.lon,lat:cam.lat,dist:cam.dist}};
}
function stopTour(){tour=null;hideCaption();document.body.classList.remove("touring");lastTouch=performance.now();cam.vLon=cam.vLat=0}
$("tour-btn").addEventListener("click",function(e){e.stopPropagation();startTour()});
window.addEventListener("pointerdown",function(e){if(tour&&!e.target.closest("#tour-btn")){stopTour();e.stopPropagation();e.preventDefault()}},true);
window.addEventListener("keydown",function(e){if(tour&&(e.key==="Escape"||e.key===" ")){stopTour()}});
function tourUpdate(dt){
  var S=tour.stops[tour.i];tour.t+=dt;
  var goal=S.follow==="iss"&&issPos?{lon:issPos.lon,lat:Math.max(-65,Math.min(65,issPos.lat))}:{lon:S.lon,lat:S.lat};
  if(tour.phase==="fly"){
    var dl=((goal.lon-tour.from.lon)%360+540)%360-180,dla=goal.lat-tour.from.lat,ang=Math.hypot(dl*Math.cos(goal.lat*D2R),dla);
    if(!tour.dur)tour.dur=reduceMotion?0.01:Math.min(5.2,2.4+ang/55);
    var u=Math.min(1,tour.t/tour.dur),e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,hop=Math.min(1.25,ang/110);
    cam.lon=tour.from.lon+dl*e;cam.lat=tour.from.lat+dla*e;cam.dist=tour.from.dist+(S.dist-tour.from.dist)*e+hop*Math.sin(Math.PI*e);
    if(u>=0.8&&!tour.cap){tour.cap=1;showCaption(S)}
    if(u>=1){tour.phase="hold";tour.t=0}
  }else{
    if(S.follow==="iss"){cam.lon=goal.lon;cam.lat=goal.lat}else cam.lon+=dt*1.1;
    cam.dist+=(S.dist*0.93-cam.dist)*dt*0.09;
    if(S.dyn)$("cap-s").textContent=S.dyn();
    if(tour.t>S.hold-1.0&&tour.cap===1){tour.cap=2;hideCaption()}
    if(tour.t>=S.hold){tour.i=(tour.i+1)%tour.stops.length;if(tour.i===0)tour.stops=buildStops();tour.from={lon:cam.lon,lat:cam.lat,dist:cam.dist};tour.phase="fly";tour.t=0;tour.dur=0;tour.cap=0}
  }
}

/* ---------- 앱으로 설치 (홈 화면) ---------- */
if("serviceWorker" in navigator&&/github\.io$/.test(location.hostname)){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(_){}}

/* ---------- 루프 ---------- */
var clockEl=$("clock"),lastSec=-1,lastT=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  var rdt=Math.max(0,(t-lastT)/1000),dt=Math.min(0.05,rdt);lastT=t;
  var now=Date.now(),s=sunLL(now+shiftMin*60000);sunDir.copy(ll2v(s.lat,s.lon,1));
  if(cloudMat.uniforms.useMap.value<0.5)cloudMat.uniforms.t.value+=dt*0.004;if(window.__sun)window.__sun.position.copy(sunDir).multiplyScalar(110);
  if(tour){tourUpdate(Math.min(0.25,rdt));clampCam()}
  else if(pcount()===0){
    if(target){
      var dl=((target.lon-cam.lon)%360+540)%360-180,k=1-Math.exp(-dt*4.5);
      cam.lon+=dl*k;cam.lat+=(target.lat-cam.lat)*k;
      if(Math.abs(dl)<0.05&&Math.abs(target.lat-cam.lat)<0.05)target=null;
    }else{
      cam.lon+=cam.vLon;cam.lat+=cam.vLat;var f=Math.exp(-dt*3.2);cam.vLon*=f;cam.vLat*=f;
      if(!current&&!reduceMotion&&t-lastTouch>2500)cam.lon+=dt*2.2;
    }
    clampCam();
  }
  quakeMat.uniforms.time.value=t/1000;
  if(satrec){var ip=issAt(now+shiftMin*60000);if(ip){issPos=ip;if(Math.abs(now+shiftMin*60000-issOrbitAt)>30000)buildOrbit(now+shiftMin*60000)}}
  else if(issLive){issPos=issLive}
  if(issPos){issSprite.position.copy(issPos.v);var ps=0.055*(cam.dist-0.6)*(1+0.12*Math.sin(t/300));issSprite.scale.set(ps,ps,1)}
  issSprite.visible=!!issPos;
  aurMat.uniforms.time.value=t/1000;
  for(var sj=0;sj<STORMS.length;sj++){var sm=STORMS[sj];sm.sprite.material.rotation+=dt*(sm.pos[1]>=0?1.4:-1.4);var ss=0.055*(cam.dist-0.6);sm.sprite.scale.set(ss,ss,1);sm.sprite.visible=!hidden(sm.v)}
  camera.position.copy(ll2v(cam.lat,cam.lon,cam.dist));camera.up.set(0,1,0);camera.lookAt(0,0,0);
  renderer.render(scene,camera);
  var sec=Math.floor(now/1000);
  if(sec!==lastSec){lastSec=sec;var d=new Date(now);
    clockEl.textContent=(shiftMin?"시간 이동 "+(shiftMin>0?"+":"−")+hm(Math.abs(shiftMin))+" → UTC "+new Date(now+shiftMin*60000).toISOString().slice(11,16):"UTC "+d.toISOString().slice(11,19))+" · 태양 직하점 "+Math.abs(s.lat).toFixed(1)+"°"+(s.lat>=0?"N":"S")+" "+Math.abs(s.lon).toFixed(1)+"°"+(s.lon>=0?"E":"W");
    tickPanel();tickISS();tickCmp();
    if(tour)$("cap-l").textContent="LIVE · UTC "+d.toISOString().slice(11,16);}
}
resize();
var kr=null;for(var i=0;i<features.length;i++)if(features[i].id==="410"){kr=features[i];break}
if(kr){if(innerWidth>720)select(kr,false);cam.lon=127;cam.lat=30}
requestAnimationFrame(frame);
})();
